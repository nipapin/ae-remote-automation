<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AE Params Editor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AE Params</h1>
      <p class="subtitle">Правьте JSON слоёв — файл сохраняется на сервере, preview берётся с 1-й секунды композиции</p>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <div class="toolbar">
          <button type="button" id="save-btn">Сохранить + Preview</button>
          <button type="button" id="preview-btn" class="secondary">Только Preview</button>
        </div>
        <div id="status-box" class="status-box">
          <div class="status-label">Статус</div>
          <div id="status-text" class="status-text">Загрузка…</div>
          <div id="error-text" class="error-text hidden"></div>
        </div>
        <div id="layers-form"></div>
      </section>

      <section class="panel result-panel">
        <h2>Preview</h2>
        <div id="preview-empty" class="result-empty">После сохранения появится кадр с 1-й секунды</div>
        <img id="preview-image" class="preview-image hidden" alt="Preview frame">
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
